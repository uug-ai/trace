name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  PR_NUMBER: ${{ github.event.number }}
  PROJECT: ${{ github.event.repository.name }}
  SHA: ${{ github.sha }}

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      # Build the Docker image with the latest tag and the release tag
      - name: Build Docker image with PR tag
        run: |
          docker build -t ${{ env.PROJECT }} \
          --build-arg github_username=${{ secrets.USERNAME }} \
          --build-arg github_token=${{ secrets.TOKEN }} .

      # This is a workaround for the issue with the Trivy DBs not being available due to
      # rate limiting. The workaround is to download the DBs and cache them.
      - name: Setup oras
        uses: oras-project/setup-oras@v1
      - name: Download and extract the vulnerability DB
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/trivy/db
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/db

      # Install Trivy manually instead of letting trivy-action's setup-trivy do
      # it, which is flaky/rate-limited against GitHub releases and fails the run.
      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # Scan the Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          skip-setup-trivy: true
          scan-type: "image"
          image-ref: ${{ env.PROJECT }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          #Below only works on the main branch
          #format: "github"
          #github-pat: ${{ secrets.TOKEN }}
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
